MEMORY {
 HEADER: start=$0000,size=$10,file=%O;
 ZP: start=$0000,size=$100,type=rw,file="";
 RAM: start=$0300,size=$500,type=rw,file="";
 MUSIC: start=$8000,size=$6000,file=%O,fill=yes,fillval=$ff;
 FIXED: start=$e000,size=$1ffa,file=%O,fill=yes,fillval=$ff;
 VECTORS: start=$fffa,size=6,file=%O;
 CHR: start=$0000,size=$2000,file=%O,fill=yes;
}
SEGMENTS {
 HEADER: load=HEADER,type=ro;
 ZEROPAGE: load=ZP,type=zp;
 RAM: load=RAM,type=bss;
 MUSIC: load=MUSIC,type=ro;
 CODE: load=FIXED,type=ro;
 VECTORS: load=VECTORS,type=ro;
 CHARS: load=CHR,type=ro;
}
