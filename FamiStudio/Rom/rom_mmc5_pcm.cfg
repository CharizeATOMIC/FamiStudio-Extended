MEMORY {
    ZP:   start = $00,   size = $0100, type = rw, file = "";
    RAM:  start = $0200, size = $0600, type = rw, file = "";
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    SONG: start = $8000, size = $4000, type = ro, file = %O, fill = yes;
    DPCM: start = $c000, size = $2000, type = ro, file = %O, fill = yes;
    PRG:  start = $e000, size = $2000, type = ro, file = %O, fill = yes;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    RAM: load = RAM, type = bss;
    HEADER: load = HDR, type = ro;
    SONG: load = SONG, type = ro;
    DPCM: load = DPCM, type = ro;
    CODE: load = PRG, type = ro;
    TOC: load = PRG, type = ro, start = $F900;
    VECTORS: load = PRG, type = ro, start = $FFFA;
    CHR: load = CHR, type = ro;
}
